<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>暮らしと喫茶の手帖</title>

  <style>
    :root{
      --bg:#faf7ef;
      --ink:#1f1f1f;
      --card:#ffffff;

      /* 額縁のマット（中の台紙） */
      --mat:#fff8ea;

      /* 影は弱め（工作感） */
      --shadow: 0 10px 24px rgba(0,0,0,.08);

      --radius:18px;
    }

    body{
      margin:0;
      font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
      color:var(--ink);
      background: linear-gradient(180deg, #fff 0%, var(--bg) 55%, #fff 100%);
    }

    header{
      max-width:980px;
      margin:0 auto;
      padding:22px 16px 10px;
    }
    h1{
      margin:0 0 6px;
      font-size:20px;
      letter-spacing:.02em;
    }
    .sub{
      margin:0;
      font-size:13px;
      opacity:.75;
    }

    main{
      max-width:980px;
      margin:0 auto;
      padding:14px 16px 40px;
    }

    /* グリッド：スマホ2列→タブ3列→PC4列 */
    .grid{
      display:grid;
      grid-template-columns: repeat(2, minmax(0,1fr));
      gap:14px;
    }
    @media (min-width: 720px){
      .grid{ grid-template-columns: repeat(3, minmax(0,1fr)); gap:18px; }
    }
    @media (min-width: 980px){
      .grid{ grid-template-columns: repeat(4, minmax(0,1fr)); }
    }

    a.card{
      display:block;
      text-decoration:none;
      color:inherit;
      background: var(--card);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
      transition: transform .08s ease, box-shadow .12s ease;
    }
    a.card:active{ transform: scale(.99); }
    a.card:hover{ box-shadow: 0 14px 34px rgba(0,0,0,.12); }

    /* =========================
       手描きっぽい「額縁」
       ========================= */
    .frame{
      padding:12px;               /* 額縁の外側余白 */
      background: transparent;
    }

    .mat{
      background: var(--mat);
      padding:10px;               /* マットの太さ */
      border: 3px solid var(--frame-color, #e6b84c);
      border-radius: 22px 18px 24px 16px; /* 不揃い */
      position: relative;
    }

    /* 2重線（外側のゆらぎ） */
    .mat::before{
      content:"";
      position:absolute;
      inset:-6px;
      border: 2px dashed var(--frame-color, #e6b84c);
      border-radius: 26px 20px 28px 18px;
      opacity:.55;
      pointer-events:none;
    }

    /* さらに手描き感：内側に薄い線 */
    .mat::after{
      content:"";
      position:absolute;
      inset:6px;
      border: 1px solid rgba(0,0,0,.06);
      border-radius: 18px 14px 20px 12px;
      pointer-events:none;
    }

    .photo{
      width:100%;
      aspect-ratio: 4/5;          /* 縦長で統一 */
      object-fit: cover;
      display:block;
      border-radius: 14px 12px 16px 10px; /* 写真も少し不揃い */
      background:#ddd;
    }

    /* 色バリエーション（あなたの絵の雰囲気：淡め・可愛い） */
    .c-yellow{ --frame-color:#e6b84c; }
    .c-blue  { --frame-color:#6aaed6; }
    .c-red   { --frame-color:#e07a7a; }
    .c-green { --frame-color:#7fb685; }
    .c-lilac { --frame-color:#b6a6e8; }
    .c-brown { --frame-color:#9b7b5a; }

    .meta{
      padding:10px 12px 12px;
    }
    .name{
      margin:0 0 4px;
      font-size:14px;
      font-weight:650;
      letter-spacing:.01em;
    }
    .one{
      margin:0;
      font-size:12px;
      opacity:.8;
      line-height:1.4;
    }

    footer{
      max-width:980px;
      margin:0 auto;
      padding:18px 16px 40px;
      font-size:12px;
      opacity:.7;
    }
    .site-title span{
  position:relative;
  display:inline-block;
}

.site-title span{
  background: linear-gradient(
    transparent 60%,
    #e9d7b8 60%
  );
  padding: 0 .2em;
}
.site-title span{
  background: linear-gradient(transparent 60%, #e9d7b8 60%);
  padding: 0 .2em;
}
  </style>
</head>

<body>
  <header>
    <h1 class="site-title">
  <span class="dot">おいしいね、の記録</span>
</h1>
    <p class="sub">写真を押すと詳細へ。おいしくて、幸せだったことを忘れたくないよね。</p>
  </header>

  <main>
    <section class="grid">

      <!-- 1 -->
      <a class="card" href="shops/american.html" aria-label="純喫茶アメリカン（難波）の詳細へ">
        <div class="frame c-red">
          <div class="mat">
            <img class="photo" src="images/american.jpg" alt="純喫茶アメリカンの写真">
          </div>
        </div>
        <div class="meta">
          <p class="name">純喫茶アメリカン（難波）</p>
          <p class="one">レトロ空気と、喫茶の王道。</p>
        </div>
      </a>

      <!-- 2 -->
      <a href="shops/kanbukuro.html" class="card" aria-label="かん袋（堺）の詳細へ">
        <div class="frame c-blue">
          <div class="mat">
            <img class="photo" src="images/kantsuburo.jpg" alt="かん袋の氷くるみ餅の写真">
          </div>
        </div>
        <div class="meta">
          <p class="name">かん袋（堺）</p>

      <!-- 3 -->

  <div class="frame c-pink">

  </div>
  <div class="meta">

</a>

      <!-- 4（次追加枠） -->
      <a class="card" href="shops/kimura.html">
  <div class="frame c-green">
    <div class="mat">
      <img class="photo" src="images/sukiyaki.jpg" alt="名代 キムラのすき焼き">
    </div
  </div>
  <div class="meta">
    <p class="name">名代 （京都）</p>

  </div>
</a>

    </sectionて
  </main>
